<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FileAgent · 员工文件助理</title><link rel="stylesheet" href="/employee.css"></head><body>
<aside><a class="brand" href="/demo"><b>F</b><span>FileAgent<small>企业文件助理</small></span></a><button id="new" class="new">＋ 新建工作区</button><h2>我的文件</h2><div id="files" aria-label="可访问文件"></div><div class="account"><div class="avatar" id="avatar">A</div><div><strong id="name">Alice</strong><small>员工工作区</small></div></div></aside>
<main><header><strong>文件助理</strong><span>内部工作区</span></header><section id="conversation" aria-label="对话" aria-live="polite"><div class="welcome"><span class="intro-icon">✦</span><h1>今天想处理什么文件？</h1><p>查找资料、总结文档，或把结果保存到你的工作区。</p><div class="suggestions"><button data-task="read"><b>总结项目文档 ↗</b><small>查看 Phoenix 的最新进度</small></button><button data-task="search"><b>查找项目资料 ↗</b><small>在可访问文件中搜索</small></button><button data-task="save"><b>保存项目摘要 ↗</b><small>在我的工作区生成一份文件</small></button></div></div></section><div id="messages" hidden></div><section id="approvals" aria-label="待审批修改"></section><div id="status" role="status"></div><form id="composer"><label class="sr" for="prompt">给文件助理发送消息</label><textarea id="prompt" rows="2" maxlength="12000" placeholder="询问文件助理…"></textarea><div><span>FileAgent 可以搜索、读取和整理文件。</span><button type="submit" aria-label="发送消息">发送 ↑</button></div></form></main>
<dialog id="preview"><div class="dialog-title"><strong id="filename"></strong><button id="close" aria-label="关闭预览">×</button></div><pre id="filetext"></pre></dialog><script src="/employee.js"></script></body></html>
