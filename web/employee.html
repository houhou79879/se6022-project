<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FileAgent · Employee file assistant</title><link rel="stylesheet" href="/employee.css"></head><body>
<aside><a class="brand" href="/demo"><b>F</b><span>FileAgent<small>Enterprise file assistant</small></span></a><button id="new" class="new">+ New workspace</button><h2>My files</h2><div id="files" aria-label="Accessible files"></div><div class="account"><div class="avatar" id="avatar">A</div><div><strong id="name">Alice</strong><small>Employee workspace</small></div></div></aside>
<main><header><strong>File assistant</strong><span>Internal workspace</span></header><section id="conversation" aria-label="Conversation" aria-live="polite"><div class="welcome"><span class="intro-icon">✦</span><h1>What would you like to work on today?</h1><p>Find material, summarise documents, or save results to your workspace.</p><div class="suggestions"><button data-task="read"><b>Summarise project documents ↗</b><small>See the latest Phoenix progress</small></button><button data-task="search"><b>Find project material ↗</b><small>Search accessible files</small></button><button data-task="save"><b>Save a project summary ↗</b><small>Create a file in my workspace</small></button></div></div></section><div id="messages" hidden></div><section id="sources" class="sources" aria-label="Retrieved sources" hidden><h2>Sources</h2><div id="source-list"></div></section><section id="approvals" aria-label="Pending approvals"></section><div id="status" role="status"></div><form id="composer"><label class="sr" for="prompt">Message the file assistant</label><textarea id="prompt" rows="2" maxlength="12000" placeholder="Ask the file assistant…"></textarea><div><span>FileAgent can search, read and organise files.</span><button type="submit" aria-label="Send message">Send ↑</button></div></form></main>
<dialog id="preview"><div class="dialog-title"><strong id="filename"></strong><button id="close" aria-label="Close preview">×</button></div><pre id="filetext"></pre></dialog><script src="/employee.js"></script></body></html>
