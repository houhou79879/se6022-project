name: docker-linux

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the Linux image
        run: docker build -t fileagent-secops:ci .

      - name: Run the regression suite inside the container
        run: |
          docker run --rm \
            --read-only \
            --tmpfs /tmp \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            fileagent-secops:ci \
            python -m unittest discover -s tests -v

      - name: Start the server and smoke-test the HTTP surface
        run: |
          set +e
          trap 'docker rm -f fileagent-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name fileagent-smoke \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /app/runtime \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -p 127.0.0.1:8765:8765 \
            fileagent-secops:ci
          if [ $? -ne 0 ]; then
            echo "::error::docker run failed"
            exit 1
          fi
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8765/api/config >/tmp/config.json 2>/tmp/curl.err && break
            sleep 1
          done
          if [ ! -s /tmp/config.json ]; then
            echo "::error::smoke failed: $(tr '\n' ' ' </tmp/curl.err)"
            {
              echo "## smoke failure"
              echo '```'
              docker ps -a
              docker logs fileagent-smoke 2>&1 | tail -50
              docker inspect --format '{{json .State}}' fileagent-smoke 2>&1
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python -c "import json; d=json.load(open('/tmp/config.json')); assert len(d['scenarios'])==8; print('scenarios=', len(d['scenarios']))"
          docker logs --tail 20 fileagent-smoke
